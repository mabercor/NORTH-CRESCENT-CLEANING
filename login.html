<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Client Login — North Crescent Facility Solutions Inc</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#1E3A5F" />

  <style>
    /* ── Reset ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens (mirror main site) ──────────────────────── */
    :root {
      --dark-blue:      #1E3A5F;
      --dark-blue-deep: #152d4a;
      --teal:           #4A9B8C;
      --teal-dark:      #3a7d70;
      --teal-light:     #6ab8aa;
      --white:          #ffffff;
      --off-white:      #f8fafc;
      --light-gray:     #f1f5f9;
      --mid-gray:       #64748b;
      --dark-gray:      #334155;
      --text-dark:      #1e293b;
      --error:          #dc2626;
      --error-bg:       #fef2f2;
      --error-border:   #fecaca;
      --success:        #16a34a;
      --shadow-lg: 0 10px 25px rgba(0,0,0,0.12), 0 4px 10px rgba(0,0,0,0.08);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html { scroll-behavior: smooth; font-size: 16px; }

    body {
      font-family: var(--font);
      color: var(--text-dark);
      background: linear-gradient(135deg, var(--dark-blue) 0%, #2a5298 55%, var(--dark-blue-deep) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Skip link ──────────────────────────────────────────────── */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 1rem;
      background: var(--teal);
      color: var(--white);
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.9rem;
      z-index: 9999;
      transition: top 0.2s;
    }
    .skip-link:focus { top: 1rem; }

    /* ── Card ───────────────────────────────────────────────────── */
    .login-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 440px;
      padding: clamp(2rem, 6vw, 3rem);
      animation: fadeUp 0.45s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Brand header ───────────────────────────────────────────── */
    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-icon {
      font-size: 2.5rem;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .brand-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--dark-blue);
      letter-spacing: -0.01em;
    }

    .brand-name span {
      color: var(--teal);
    }

    .brand-tagline {
      font-size: 0.8rem;
      color: var(--mid-gray);
      margin-top: 0.2rem;
    }

    /* ── Heading ────────────────────────────────────────────────── */
    .login-heading {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--dark-blue);
      margin-bottom: 0.35rem;
    }

    .login-subheading {
      font-size: 0.9rem;
      color: var(--mid-gray);
      margin-bottom: 1.75rem;
    }

    /* ── Alert banner ───────────────────────────────────────────── */
    .alert {
      display: none;
      align-items: flex-start;
      gap: 0.6rem;
      padding: 0.875rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
      border: 1px solid transparent;
    }
    .alert.alert-error {
      display: flex;
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error);
    }
    .alert.alert-info {
      display: flex;
      background: #eff6ff;
      border-color: #bfdbfe;
      color: #1d4ed8;
    }
    .alert.alert-success {
      display: flex;
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: var(--success);
    }
    .alert-icon { flex-shrink: 0; font-size: 1rem; }

    /* ── Form fields ────────────────────────────────────────────── */
    .field {
      margin-bottom: 1.25rem;
    }

    .field label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--dark-gray);
      margin-bottom: 0.4rem;
    }

    .field .required-mark {
      color: var(--error);
      margin-left: 0.15rem;
    }

    .input-wrap {
      position: relative;
    }

    .field input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #cbd5e1;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: var(--font);
      color: var(--text-dark);
      background: var(--white);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .field input::placeholder { color: #94a3b8; }

    .field input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(74,155,140,0.15);
    }

    .field input[aria-invalid="true"] {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(220,38,38,0.1);
    }

    /* password input with toggle button */
    .field input.has-toggle {
      padding-right: 3rem;
    }

    .toggle-pwd {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--mid-gray);
      padding: 0.25rem;
      border-radius: var(--radius-sm);
      line-height: 1;
      font-size: 1.1rem;
      transition: color 0.2s;
    }
    .toggle-pwd:hover,
    .toggle-pwd:focus-visible {
      color: var(--teal);
      outline: 2px solid var(--teal);
      outline-offset: 2px;
    }

    .field-error {
      display: none;
      font-size: 0.8rem;
      color: var(--error);
      margin-top: 0.35rem;
      font-weight: 500;
    }
    .field-error.visible { display: block; }

    /* ── Row utilities ──────────────────────────────────────────── */
    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.4rem;
    }

    .forgot-link {
      font-size: 0.8rem;
      color: var(--teal);
      font-weight: 500;
      transition: color 0.2s;
    }
    .forgot-link:hover { color: var(--teal-dark); text-decoration: underline; }

    /* ── Submit button ──────────────────────────────────────────── */
    .btn-login {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: var(--teal);
      color: var(--white);
      border: none;
      border-radius: var(--radius-full);
      font-size: 1rem;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-top: 0.5rem;
    }
    .btn-login:hover {
      background: var(--teal-dark);
      box-shadow: 0 4px 12px rgba(74,155,140,0.35);
    }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:focus-visible {
      outline: 3px solid var(--teal);
      outline-offset: 3px;
    }
    .btn-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* spinner inside button */
    .btn-spinner {
      display: none;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-login.loading .btn-spinner { display: block; }
    .btn-login.loading .btn-text    { opacity: 0.75; }

    /* ── Divider ────────────────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.5rem 0;
      color: #cbd5e1;
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    /* ── Back to site link ──────────────────────────────────────── */
    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-size: 0.875rem;
      color: var(--mid-gray);
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--teal); }

    /* ── Footer note ────────────────────────────────────────────── */
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.55);
    }

    /* ── Responsive ─────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .login-card { padding: 1.75rem 1.25rem; }
    }
  </style>
</head>
<body>

  <a href="#login-form" class="skip-link">Skip to login form</a>

  <main class="login-card" role="main">

    <!-- Brand -->
    <div class="brand" aria-label="North Crescent Facility Solutions Inc">
      <div class="brand-icon" aria-hidden="true">🧹</div>
      <div class="brand-name">North <span>Crescent</span></div>
      <div class="brand-tagline">Facility Solutions Inc</div>
    </div>

    <h1 class="login-heading">Welcome back</h1>
    <p class="login-subheading">Sign in to your client portal</p>

    <!-- Global alert (shown on error / success) -->
    <div id="login-alert" class="alert" role="alert" aria-live="polite">
      <span class="alert-icon" aria-hidden="true"></span>
      <span id="login-alert-msg"></span>
    </div>

    <!-- Login form -->
    <form id="login-form" novalidate aria-label="Login form">

      <!-- Email -->
      <div class="field">
        <label for="email">
          Email address
          <span class="required-mark" aria-hidden="true">*</span>
        </label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
          aria-required="true"
          aria-describedby="email-error"
        />
        <span id="email-error" class="field-error" role="alert"></span>
      </div>

      <!-- Password -->
      <div class="field">
        <div class="row-between">
          <label for="password">
            Password
            <span class="required-mark" aria-hidden="true">*</span>
          </label>
          <a href="#" class="forgot-link" id="forgot-link">Forgot password?</a>
        </div>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
            aria-required="true"
            aria-describedby="password-error"
            class="has-toggle"
          />
          <button
            type="button"
            class="toggle-pwd"
            id="toggle-pwd"
            aria-label="Show password"
            aria-pressed="false"
            title="Toggle password visibility"
          >
            <span aria-hidden="true" id="toggle-pwd-icon">👁</span>
          </button>
        </div>
        <span id="password-error" class="field-error" role="alert"></span>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-login" id="btn-login">
        <span class="btn-spinner" aria-hidden="true"></span>
        <span class="btn-text">Sign In</span>
      </button>

    </form>

    <div class="divider">or</div>

    <!-- Back to site -->
    <a href="/" class="back-link" aria-label="Back to North Crescent main website">
      <span aria-hidden="true">←</span> Back to website
    </a>

  </main>

  <p class="login-footer">
    © <span id="footer-year"></span> North Crescent Facility Solutions Inc · Moncton, NB
  </p>

  <script>
    (function () {
      'use strict';

      /* ── Year in footer ───────────────────────────────────────── */
      var yearEl = document.getElementById('footer-year');
      if (yearEl) yearEl.textContent = new Date().getFullYear();

      /* ── Element refs ─────────────────────────────────────────── */
      var form      = document.getElementById('login-form');
      var emailEl   = document.getElementById('email');
      var pwdEl     = document.getElementById('password');
      var toggleBtn = document.getElementById('toggle-pwd');
      var toggleIcon= document.getElementById('toggle-pwd-icon');
      var submitBtn = document.getElementById('btn-login');
      var alertBox  = document.getElementById('login-alert');
      var alertMsg  = document.getElementById('login-alert-msg');
      var forgotLink= document.getElementById('forgot-link');

      /* ── Helpers ──────────────────────────────────────────────── */
      function showFieldError(input, errorEl, msg) {
        input.setAttribute('aria-invalid', 'true');
        errorEl.textContent = msg;
        errorEl.classList.add('visible');
      }

      function clearFieldError(input, errorEl) {
        input.removeAttribute('aria-invalid');
        errorEl.textContent = '';
        errorEl.classList.remove('visible');
      }

      function showAlert(type, msg) {
        alertBox.className = 'alert alert-' + type;
        var icon = type === 'error' ? '⚠️' : type === 'info' ? 'ℹ️' : '✅';
        alertBox.querySelector('.alert-icon').textContent = icon;
        alertMsg.textContent = msg;
      }

      function hideAlert() {
        alertBox.className = 'alert';
        alertMsg.textContent = '';
      }

      function setLoading(loading) {
        submitBtn.disabled = loading;
        submitBtn.classList.toggle('loading', loading);
        submitBtn.setAttribute('aria-busy', String(loading));
      }

      /* ── Validate individual fields ───────────────────────────── */
      function validateEmail() {
        var errorEl = document.getElementById('email-error');
        var val = emailEl.value.trim();
        if (!val) {
          showFieldError(emailEl, errorEl, 'Email address is required.');
          return false;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val)) {
          showFieldError(emailEl, errorEl, 'Please enter a valid email address.');
          return false;
        }
        clearFieldError(emailEl, errorEl);
        return true;
      }

      function validatePassword() {
        var errorEl = document.getElementById('password-error');
        var val = pwdEl.value;
        if (!val) {
          showFieldError(pwdEl, errorEl, 'Password is required.');
          return false;
        }
        if (val.length < 8) {
          showFieldError(pwdEl, errorEl, 'Password must be at least 8 characters.');
          return false;
        }
        clearFieldError(pwdEl, errorEl);
        return true;
      }

      /* ── Inline validation on blur ────────────────────────────── */
      emailEl.addEventListener('blur', validateEmail);
      pwdEl.addEventListener('blur', validatePassword);

      /* ── Clear errors on input ────────────────────────────────── */
      emailEl.addEventListener('input', function () {
        clearFieldError(emailEl, document.getElementById('email-error'));
        hideAlert();
      });
      pwdEl.addEventListener('input', function () {
        clearFieldError(pwdEl, document.getElementById('password-error'));
        hideAlert();
      });

      /* ── Show / hide password ─────────────────────────────────── */
      toggleBtn.addEventListener('click', function () {
        var isPassword = pwdEl.type === 'password';
        pwdEl.type = isPassword ? 'text' : 'password';
        toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        toggleBtn.setAttribute('aria-pressed', String(isPassword));
        toggleIcon.textContent = isPassword ? '🙈' : '👁';
      });

      /* ── Forgot password ──────────────────────────────────────── */
      forgotLink.addEventListener('click', function (e) {
        e.preventDefault();
        showAlert('info', 'Password reset is not yet available. Please contact us at info@northcrescentcleaning.com or call (428) 888‑0542.');
      });

      /* ── Form submit ──────────────────────────────────────────── */
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        hideAlert();

        var emailOk = validateEmail();
        var pwdOk   = validatePassword();

        if (!emailOk || !pwdOk) {
          /* Focus first invalid field */
          if (!emailOk) emailEl.focus();
          else pwdEl.focus();
          return;
        }

        /* Simulate async authentication */
        setLoading(true);

        setTimeout(function () {
          setLoading(false);
          /*
           * TODO: Replace this stub with a real authentication call.
           * On success redirect to the client dashboard.
           * On failure call: showAlert('error', 'Invalid email or password. Please try again.');
           */
          showAlert('error', 'Invalid email or password. Please try again.');
          pwdEl.value = '';
          pwdEl.focus();
        }, 1200);
      });

    }());
  </script>
</body>
</html>
