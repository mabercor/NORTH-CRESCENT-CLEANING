  <!-- Puntos decorativos arriba -->
  <circle cx="192" cy="34"  r="6"   fill="#2DB87A"/>
  <circle cx="211" cy="21"  r="4"   fill="#1B3A6B"/>
  <circle cx="272" cy="24"  r="4"   fill="#2DB87A"/>
  <circle cx="292" cy="40"  r="6"   fill="#1B3A6B"/>

