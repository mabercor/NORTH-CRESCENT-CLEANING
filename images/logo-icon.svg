  <circle cx="126" cy="102" r="4.5" fill="rgba(255,255,255,0.22)"/>
  <circle cx="147" cy="100" r="4.5" fill="rgba(255,255,255,0.22)"/>
  <circle cx="128" cy="124" r="4.5" fill="rgba(255,255,255,0.22)"/>
  <circle cx="149" cy="122" r="4.5" fill="rgba(255,255,255,0.22)"/>

  <!-- EDIFICIO DERECHO — paralelogramo teal (inclina a la izquierda) -->
