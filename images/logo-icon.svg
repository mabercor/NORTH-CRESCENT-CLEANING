  <circle cx="345" cy="124" r="4.5" fill="rgba(255,255,255,0.22)"/>

  <!-- EDIFICIO CENTRAL — teal/aguamarina, ligeramente más alto -->
  <polygon points="196,238 284,238 280,65 200,65" fill="#3AADA0"/>

  <!-- SILUETA CASA (blanca, primer plano) -->
  <polygon points="172,186 308,186 240,130" fill="white"/>
  <rect x="197" y="186" width="86" height="52" fill="white"/>
  <!-- Ventana de 4 paneles (como el logo real) -->
  <rect x="218" y="198" width="44" height="32" rx="2" fill="#2DB87A"/>
  <line x1="240" y1="198" x2="240" y2="230" stroke="white" stroke-width="2.5"/>
  <line x1="218" y1="214" x2="262" y2="214" stroke="white" stroke-width="2.5"/>

  <!-- ESTRELLA DESTELLO 4 PUNTAS (blanca, centro de edificios) -->
  <path d="M240 102 L244.5 116 L258 119.5 L244.5 123 L240 137 L235.5 123 L222 119.5 L235.5 116 Z" fill="white"/>

  <!-- ARCO VERDE (crescent/media luna) -->
  <path d="M74,242 C142,200 338,200 406,242" stroke="#2DB87A" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- DESTELLO IZQUIERDO (6 líneas, estilo asterisco) -->
  <g transform="translate(76,116)" stroke="#2DB87A" stroke-width="1.8" stroke-linecap="round">
    <line x1="0" y1="-11" x2="0" y2="11"/>
    <line x1="-11" y1="0" x2="11" y2="0"/>
    <line x1="-7.8" y1="-7.8" x2="7.8" y2="7.8"/>
    <line x1="7.8" y1="-7.8" x2="-7.8" y2="7.8"/>
    <line x1="-10" y1="-4" x2="10" y2="4"/>
    <line x1="10" y1="-4" x2="-10" y2="4"/>
  </g>
  <!-- Puntos decorativos izquierda -->
  <circle cx="95"  cy="80"  r="6.5" fill="#1B3A6B"/>
  <circle cx="79"  cy="64"  r="4"   fill="#2DB87A"/>
  <circle cx="87"  cy="152" r="5"   fill="#2DB87A"/>
  <circle cx="100" cy="42"  r="3"   fill="#2DB87A"/>

