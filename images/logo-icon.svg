  <circle cx="406" cy="168" r="4"   fill="#2DB87A"/>
  <circle cx="392" cy="180" r="5.5" fill="#1B3A6B"/>
  <circle cx="379" cy="54"  r="3"   fill="#2DB87A"/>

  <!-- DESTELLO SUPERIOR PEQUEÑO -->
  <g transform="translate(240,34)" stroke="#1B3A6B" stroke-width="1.7" stroke-linecap="round">
    <line x1="0" y1="-8" x2="0" y2="8"/>
    <line x1="-8" y1="0" x2="8" y2="0"/>
    <line x1="-5.7" y1="-5.7" x2="5.7" y2="5.7"/>
    <line x1="5.7" y1="-5.7" x2="-5.7" y2="5.7"/>
