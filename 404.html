<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Page Not Found — North Crescent Facility Solutions Inc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231E3A5F'/><text y='70' x='50' text-anchor='middle' font-size='55' font-family='Arial' fill='%234A9B8C'>NC</text></svg>" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1E3A5F 0%, #2a5298 50%, #152d4a 100%);
      text-align: center;
      padding: 2rem;
    }
    .error-content {
      max-width: 560px;
    }
    .error-code {
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 800;
      color: #4A9B8C;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .error-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .error-content h1 {
      color: #ffffff;
      font-size: clamp(1.4rem, 3vw, 2rem);
      margin-bottom: 1rem;
    }
    .error-content p {
      color: rgba(255,255,255,0.75);
      font-size: 1.05rem;
      margin-bottom: 2.5rem;
      line-height: 1.7;
    }
    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
  </style>
</head>
<body>
  <main class="error-page" aria-label="Page not found">
    <div class="error-content">
      <div class="error-icon" aria-hidden="true">🧹</div>
      <div class="error-code" aria-label="Error 404">404</div>
      <h1>Oops — this page has been cleaned away!</h1>
      <p>
        The page you're looking for doesn't exist or may have been moved.
        Let us help you find what you need.
      </p>
      <div class="error-actions">
        <a href="/" class="btn btn-primary">← Back to Home</a>
        <a href="/#contact" class="btn btn-outline">Get a Free Quote</a>
      </div>
    </div>
  </main>
</body>
</html>
